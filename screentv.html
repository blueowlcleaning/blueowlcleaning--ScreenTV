<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ScreenTV"/>
<title>ScreenTV — Movies, Series & Entertainment</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#0a0a0f;color:#f0f0f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overscroll-behavior:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.hdr{padding:env(safe-area-inset-top,48px) 16px 0;background:#0a0a0f;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,0.05)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#141E30,#243B55);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-text{font-size:22px;font-weight:800;background:linear-gradient(135deg,#141E30,#243B55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.hdr-sub{font-size:10px;color:#444;margin-top:1px}
.hdr-count{font-size:10px;color:#444;font-family:monospace;text-align:right}
.search-wrap{position:relative;padding:0 0 10px}
.search-input{width:100%;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 16px 11px 40px;color:#f0f0f5;font-size:14px;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:rgba(255,180,100,0.4)}
.search-input::placeholder{color:#444}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-60%);font-size:15px;pointer-events:none}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-60%);background:rgba(255,255,255,0.1);border:none;color:#aaa;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center}
.age-row{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto}
.age-row::-webkit-scrollbar{display:none}
.age-btn{flex-shrink:0;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);color:#666;border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s}
.age-btn.on{background:#fff;color:#000;border-color:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px}
.cats::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;border:1.5px solid transparent;white-space:nowrap}
.chip.off{background:rgba(255,255,255,0.05);color:#666;border-color:rgba(255,255,255,0.08)}
.chip.on{color:#000}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px 0;animation:fadeIn 0.3s ease}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:14px;overflow:hidden;cursor:pointer;background:#14141c;border:1px solid rgba(255,255,255,0.07);text-decoration:none;display:block;transition:transform 0.15s}
.card:active{transform:scale(0.96)}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#1a1a24}
.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.3s}
.thumb.loading{opacity:0}
.thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;background:rgba(0,0,0,0.3)}
.play-icon{width:38px;height:38px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:3px}
.card:hover .play-btn{opacity:1}
.card-body{padding:8px 10px 10px}
.card-title{font-size:11.5px;font-weight:600;color:#e0e0ea;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-ch{font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%}
.card-age{font-size:9px;background:rgba(255,255,255,0.07);border-radius:8px;padding:2px 6px;color:#777;font-weight:700;flex-shrink:0}
.skel{background:#14141c;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.skel-thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(90deg,#1a1a24 25%,#22222e 50%,#1a1a24 75%);background-size:400px 100%;animation:shimmer 1.4s infinite}
.skel-body{padding:8px 10px 10px}
.skel-line{height:10px;border-radius:5px;background:linear-gradient(90deg,#1a1a24 25%,#22222e 50%,#1a1a24 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;margin-bottom:6px}
.skel-line.short{width:55%}
.lmw{padding:20px 16px 30px;display:flex;justify-content:center}
.lmbtn{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);color:#aaa;border-radius:14px;padding:12px 28px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.lmbtn:disabled{opacity:0.4;cursor:default}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-msg{font-size:14px;color:#444;line-height:1.7}
.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,0.15);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
.bottom-pad{height:env(safe-area-inset-bottom,24px)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div>
        <div class="logo-text">ScreenTV</div>
        <div class="hdr-sub">Movies, Series & Entertainment</div>
      </div>
    </div>
    <div class="hdr-count" id="count">Loading…</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" placeholder="Search ScreenTV…" oninput="onSearch()" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="search-clear" id="clr" onclick="clearSearch()">✕</button>
  </div>
  <div class="age-row" id="age-row"></div>
  <div class="cats" id="cats"></div>
</div>
<div class="grid" id="grid"></div>
<div class="lmw" id="lmw" style="display:none"><button class="lmbtn" id="lmbtn" onclick="loadMore()"><span>Load More</span></button></div>
<div class="bottom-pad"></div>
<script>
const API_KEY='AIzaSyDd3PO_N58ybGonVpNFNXGr3cCPsKu33Hw';
const API_BASE='https://www.googleapis.com/youtube/v3/search';
const MAX_RESULTS=48;
const CATS=[
  {id:"foryou",e:"✨",label:"For You",q:"best movies series entertainment trailers reviews 2024",c:"#2980B9"},
  {id:"trailers",e:"🎬",label:"Trailers",q:"latest movie trailers 2024 upcoming films blockbuster",c:"#1A252F"},
  {id:"nollywood",e:"🎭",label:"Nollywood",q:"nollywood movies 2024 Nigerian film best scenes clips",c:"#D35400"},
  {id:"hollywood",e:"🌟",label:"Hollywood",q:"hollywood movies best scenes clips review 2024",c:"#F39C12"},
  {id:"bollywood",e:"💃",label:"Bollywood",q:"bollywood movies songs scenes 2024 best Indian cinema",c:"#E74C3C"},
  {id:"african",e:"🌍",label:"African Cinema",q:"african cinema film Ethiopia Ghana South Africa 2024",c:"#27AE60"},
  {id:"series",e:"📺",label:"TV Series",q:"TV series best scenes reviews Netflix HBO 2024",c:"#9C27B0"},
  {id:"action",e:"💥",label:"Action",q:"best action movies scenes fights stunts compilation 2024",c:"#F44336"},
  {id:"comedy",e:"😂",label:"Comedy Films",q:"comedy movies funniest scenes clips best 2024",c:"#FFD200"},
  {id:"thriller",e:"😱",label:"Thriller",q:"thriller suspense movies best scenes review 2024",c:"#37474F"},
  {id:"romance",e:"❤️",label:"Romance",q:"romantic movies best scenes love stories 2024",c:"#E91E63"},
  {id:"scifi",e:"🚀",label:"Sci-Fi",q:"science fiction movies best scenes effects review 2024",c:"#00BCD4"},
  {id:"horror",e:"👻",label:"Horror",q:"horror movies best scenes review top list 2024",c:"#1C2833"},
  {id:"documentary",e:"📽️",label:"Docs",q:"documentary films best full length free streaming 2024",c:"#4CAF50"},
  {id:"animation",e:"🎨",label:"Animation",q:"animated movies best scenes Pixar Disney review 2024",c:"#FF9800"},
  {id:"awards",e:"🏆",label:"Awards",q:"Oscar Grammy BAFTA award winners best films 2024",c:"#D4AC0D"},
  {id:"review",e:"⭐",label:"Reviews",q:"movie review honest best worst rating films 2024",c:"#607D8B"},
  {id:"shorts",e:"📱",label:"Short Films",q:"short films best award winning independent cinema",c:"#795548"},
  {id:"bts",e:"🎥",label:"Behind Scenes",q:"behind the scenes making of movies production secrets",c:"#455A64"},
  {id:"classics",e:"📀",label:"Classics",q:"classic movies greatest films ever made all time best",c:"#5D6D7E"},
];
const AGE_LABELS={all:'All',baby:'0-2y',toddler:'2-4y',preschool:'4-5y',teen:'Teen',adult:'Adult'};
const AGE_SUFFIXES={all:'',baby:' for babies beginners easy simple',toddler:' for toddlers beginners',preschool:' for beginners preschool level',teen:' for teens youth',adult:' advanced expert'};
let curCat=CATS[0],curAge='all',pageToken='',loading=false,loaded=0,sTimer=null,curQ='';
function buildAges(){
  const row=document.getElementById('age-row');
  const ages=['all','baby','toddler','preschool','teen','adult'];
  const icons={all:'✨',baby:'👶',toddler:'🐣',preschool:'🎒',teen:'🧑',adult:'👤'};
  row.innerHTML=ages.map(a=>`<button class="age-btn ${a==='all'?'on':''}" onclick="setAge('${a}',this)">${icons[a]} ${AGE_LABELS[a]}</button>`).join('');
}
function buildCats(){
  document.getElementById('cats').innerHTML=CATS.map(c=>
    `<div class="chip ${c.id===curCat.id?'on':'off'}" style="${c.id===curCat.id?`background:${c.c};border-color:${c.c}`:`border-color:${c.c}33;color:${c.c}`}" onclick="selectCat('${c.id}')">${c.e} ${c.label}</div>`
  ).join('');
}
function selectCat(id){
  const cat=CATS.find(c=>c.id===id);if(!cat||cat.id===curCat.id)return;
  curCat=cat;document.getElementById('search').value='';document.getElementById('clr').style.display='none';
  curQ='';pageToken='';loaded=0;buildCats();fetchVideos(true);
}
function setAge(age,el){
  curAge=age;document.querySelectorAll('.age-btn').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  pageToken='';loaded=0;fetchVideos(true);
}
function onSearch(){
  const v=document.getElementById('search').value;
  document.getElementById('clr').style.display=v?'flex':'none';
  clearTimeout(sTimer);sTimer=setTimeout(()=>{curQ=v.trim();pageToken='';loaded=0;fetchVideos(true);},500);
}
function clearSearch(){
  document.getElementById('search').value='';document.getElementById('clr').style.display='none';
  curQ='';pageToken='';loaded=0;fetchVideos(true);
}
function buildQuery(){return(curQ||curCat.q)+(AGE_SUFFIXES[curAge]||'');}
function showSkels(n=12){
  document.getElementById('grid').innerHTML=Array(n).fill(0).map(()=>`<div class="skel"><div class="skel-thumb"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>`).join('');
}
async function fetchVideos(reset=false){
  if(loading)return;loading=true;
  const btn=document.getElementById('lmbtn'),lmw=document.getElementById('lmw');
  if(reset){showSkels();lmw.style.display='none';}
  else{btn.disabled=true;btn.innerHTML='<div class="spinner"></div><span>Loading…</span>';}
  const params=new URLSearchParams({part:'snippet',type:'video',safeSearch:'strict',maxResults:MAX_RESULTS,q:buildQuery(),key:API_KEY,relevanceLanguage:'en',...(!reset&&pageToken?{pageToken}:{})});
  try{
    const res=await fetch(`${API_BASE}?${params}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const items=data.items||[];pageToken=data.nextPageToken||'';
    if(reset){renderCards(items,false);loaded=items.length;}
    else{appendCards(items);loaded+=items.length;}
    document.getElementById('count').textContent=`${loaded.toLocaleString()}+ videos`;
    if(pageToken){lmw.style.display='flex';btn.disabled=false;btn.innerHTML='<span>Load More</span>';}
    else lmw.style.display='none';
  }catch(e){
    if(reset)document.getElementById('grid').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-msg">Couldn't load videos.<br>Check your internet &amp; try again.<br><small style="color:#333">${e.message}</small></div></div>`;
    lmw.style.display='none';
  }
  loading=false;
}
function loadMore(){fetchVideos(false);}
function renderCards(items,append){
  const grid=document.getElementById('grid');
  if(!append)grid.innerHTML='';
  if(!items.length&&!append){grid.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-msg">No videos found.<br>Try a different search.</div></div>`;return;}
  items.forEach(item=>grid.appendChild(buildCard(item)));
}
function appendCards(items){document.getElementById('grid').querySelectorAll;const grid=document.getElementById('grid');items.forEach(item=>grid.appendChild(buildCard(item)));}
function buildCard(item){
  const vid=item.id.videoId,sn=item.snippet;
  const title=sn.title.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const ch=sn.channelTitle;
  const thumb=sn.thumbnails?.medium?.url||sn.thumbnails?.default?.url||'';
  const url=`https://www.youtube.com/watch?v=${vid}`;
  const a=document.createElement('a');
  a.className='card';a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  a.innerHTML=`<div class="thumb-wrap"><div class="thumb-placeholder" style="background:linear-gradient(135deg,${curCat.c}22,${curCat.c}08)">${curCat.e}</div><img class="thumb loading" src="${thumb}" alt="${title.replace(/"/g,'&quot;')}" loading="lazy" onload="this.classList.remove('loading')" onerror="this.style.display='none'"><div class="play-btn"><div class="play-icon">▶</div></div></div><div class="card-body"><div class="card-title">${title}</div><div class="card-meta"><div class="card-ch">${ch}</div><div class="card-age">${AGE_LABELS[curAge]}</div></div></div>`;
  return a;
}
buildAges();buildCats();fetchVideos(true);
</script>
</body>
</html>
