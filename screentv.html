<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ScreenTV"/>
<title>ScreenTV — Full Movies</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#0a0a0f;color:#f0f0f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overscroll-behavior:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.hdr{padding:env(safe-area-inset-top,48px) 16px 0;background:#0a0a0f;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,0.05)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#141E30,#243B55,#c0392b);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.logo-text{font-size:22px;font-weight:800;background:linear-gradient(135deg,#e74c3c,#f39c12,#f1c40f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.logo-sub{font-size:10px;color:#555;margin-top:1px}
.hdr-count{font-size:10px;color:#444;font-family:monospace;text-align:right;line-height:1.5}
.notice{background:linear-gradient(135deg,rgba(231,76,60,0.12),rgba(243,156,18,0.08));border:1px solid rgba(231,76,60,0.2);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#aaa;line-height:1.5}
.notice span{color:#e74c3c;font-weight:700}
.search-wrap{position:relative;padding:0 0 10px}
.search-input{width:100%;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 16px 11px 40px;color:#f0f0f5;font-size:14px;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:rgba(231,76,60,0.5)}
.search-input::placeholder{color:#444}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-60%);font-size:15px;pointer-events:none}
.clr{position:absolute;right:12px;top:50%;transform:translateY(-60%);background:rgba(255,255,255,0.1);border:none;color:#aaa;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center}
.genre-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px}
.genre-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;border:1.5px solid transparent;white-space:nowrap}
.chip.off{background:rgba(255,255,255,0.05);color:#666;border-color:rgba(255,255,255,0.08)}
.chip.on{color:#000}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 16px 0;animation:fadeIn 0.3s ease}
@media(min-width:500px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:750px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:14px;overflow:hidden;cursor:pointer;background:#14141c;border:1px solid rgba(255,255,255,0.07);text-decoration:none;display:block;transition:transform 0.15s}
.card:active{transform:scale(0.96)}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#1a1a24}
.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.3s}
.thumb.loading{opacity:0}
.thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);opacity:0;transition:opacity 0.2s}
.card:hover .play-overlay{opacity:1}
.play-circle{width:42px;height:42px;background:rgba(255,255,255,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:3px}
.duration-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.85);color:#fff;font-size:9px;font-family:monospace;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:0.5px}
.full-badge{position:absolute;top:6px;left:6px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-size:8px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:0.8px}
.card-body{padding:8px 10px 11px}
.card-title{font-size:12px;font-weight:600;color:#e0e0ea;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-ch{font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.card-genre{font-size:9px;border-radius:8px;padding:2px 7px;font-weight:700;flex-shrink:0}
.skel{background:#14141c;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.skel-thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(90deg,#1a1a24 25%,#22222e 50%,#1a1a24 75%);background-size:400px 100%;animation:shimmer 1.4s infinite}
.skel-body{padding:8px 10px 10px}
.skel-line{height:10px;border-radius:5px;background:linear-gradient(90deg,#1a1a24 25%,#22222e 50%,#1a1a24 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;margin-bottom:6px}
.skel-line.s{width:55%}
.lmw{padding:20px 16px 30px;display:flex;justify-content:center}
.lmbtn{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);color:#aaa;border-radius:14px;padding:13px 32px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.2s}
.lmbtn:disabled{opacity:0.4;cursor:default}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty-msg{font-size:14px;color:#444;line-height:1.8}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.15);border-top-color:#e74c3c;border-radius:50%;animation:spin 0.7s linear infinite}
.bottom-pad{height:env(safe-area-inset-bottom,28px)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div>
        <div class="logo-text">ScreenTV</div>
        <div class="logo-sub">Full Movies · All Industries · All Continents</div>
      </div>
    </div>
    <div class="hdr-count" id="count">Loading…</div>
  </div>
  <div class="notice"><span>🎬 FULL MOVIES ONLY</span> — All results filtered to 20+ minutes. Free on YouTube with ads.</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" placeholder="Search movies, actors, directors…" oninput="onSearch()" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="clr" id="clr" onclick="clearSearch()">✕</button>
  </div>
  <div class="genre-row" id="genres"></div>
</div>
<div class="grid" id="grid"></div>
<div class="lmw" id="lmw" style="display:none"><button class="lmbtn" id="lmbtn" onclick="loadMore()"><span>Load More Movies</span></button></div>
<div class="bottom-pad"></div>

<script>
const API_KEY = 'AIzaSyDd3PO_N58ybGonVpNFNXGr3cCPsKu33Hw';
const API_BASE = 'https://www.googleapis.com/youtube/v3/search';
const MAX = 48;

// ALL categories — full movie search queries only
const GENRES = [
  {id:'foryou',    e:'✨', label:'For You',         q:'full movie free 2024 award winning',                                       c:'#e74c3c'},
  {id:'nollywood', e:'🇳🇬', label:'Nollywood',       q:'nollywood full movie 2024 nigerian film free',                             c:'#D35400'},
  {id:'nollywood2',e:'🎭', label:'Nollywood Classic',q:'nollywood full movie best classic nigerian film free to watch',            c:'#E67E22'},
  {id:'ghana',     e:'🇬🇭', label:'Ghallywood',      q:'ghallywood ghana full movie free 2024 african film',                       c:'#F39C12'},
  {id:'africa',    e:'🌍', label:'African Cinema',   q:'african full movie free south africa kenya ethiopia film',                  c:'#A04000'},
  {id:'swahili',   e:'🎬', label:'Swahili Film',     q:'swahili full movie free bongo east africa kenya',                          c:'#27AE60'},
  {id:'hausa',     e:'🎞️', label:'Kannywood',        q:'hausa kannywood full movie free northern nigeria 2024',                    c:'#C0392B'},
  {id:'hollywood', e:'🌟', label:'Hollywood',        q:'hollywood full movie free 2024 english film complete',                     c:'#F1C40F'},
  {id:'hollywood2',e:'🏆', label:'Hollywood Classic',q:'hollywood classic full movie free old film complete watch',                c:'#D4AC0D'},
  {id:'action',    e:'💥', label:'Action',           q:'action full movie free english 2024 fight thriller complete',              c:'#E74C3C'},
  {id:'comedy_m',  e:'😂', label:'Comedy Film',      q:'comedy full movie free funny complete watch english 2024',                 c:'#FFD200'},
  {id:'romance',   e:'❤️', label:'Romance',          q:'romance love full movie free complete watch english 2024',                 c:'#E91E63'},
  {id:'thriller',  e:'😱', label:'Thriller',         q:'thriller suspense full movie free complete watch 2024',                    c:'#8E44AD'},
  {id:'horror',    e:'👻', label:'Horror',           q:'horror full movie free complete watch scary english 2024',                 c:'#2C3E50'},
  {id:'drama',     e:'🎭', label:'Drama',            q:'drama full movie free complete watch english award 2024',                  c:'#6C3483'},
  {id:'scifi',     e:'🚀', label:'Sci-Fi',           q:'science fiction full movie free complete watch 2024',                      c:'#00BCD4'},
  {id:'animation', e:'🎨', label:'Animation',        q:'animated full movie free complete kids family watch 2024',                 c:'#FF9800'},
  {id:'bollywood', e:'💃', label:'Bollywood',        q:'bollywood full movie free hindi complete watch 2024',                      c:'#E74C3C'},
  {id:'bollywood2',e:'🎵', label:'Bollywood Classic',q:'bollywood classic full movie free hindi old film complete',                c:'#C0392B'},
  {id:'telugu',    e:'🌺', label:'Telugu',           q:'telugu full movie free complete watch 2024 tollywood',                     c:'#9B59B6'},
  {id:'tamil',     e:'🎶', label:'Tamil',            q:'tamil full movie free complete watch 2024 kollywood',                      c:'#8E44AD'},
  {id:'kannada',   e:'🌟', label:'Kannada',          q:'kannada full movie free complete watch 2024 sandalwood',                   c:'#6C3483'},
  {id:'malayalam', e:'🌴', label:'Malayalam',        q:'malayalam full movie free complete watch 2024',                            c:'#27AE60'},
  {id:'punjabi',   e:'🎸', label:'Punjabi',          q:'punjabi full movie free complete watch 2024',                              c:'#E67E22'},
  {id:'chinese',   e:'🐉', label:'Chinese',          q:'chinese full movie free complete watch english subtitles 2024',            c:'#D32F2F'},
  {id:'korean',    e:'🇰🇷', label:'Korean',           q:'korean full movie free complete watch english subtitles 2024',             c:'#1F618D'},
  {id:'japanese',  e:'🗾', label:'Japanese',         q:'japanese full movie free complete watch english subtitles',                c:'#E74C3C'},
  {id:'turkish',   e:'🌙', label:'Turkish',          q:'turkish full movie free complete watch english subtitles',                 c:'#B03A2E'},
  {id:'spanish',   e:'💃', label:'Spanish',          q:'spanish full movie free complete watch english subtitles',                 c:'#F39C12'},
  {id:'french',    e:'🗼', label:'French',           q:'french full movie free complete watch english subtitles',                  c:'#3498DB'},
  {id:'italian',   e:'🍕', label:'Italian',          q:'italian full movie free complete watch english subtitles',                 c:'#27AE60'},
  {id:'russian',   e:'❄️', label:'Russian',          q:'russian full movie free complete watch english subtitles',                 c:'#1A5276'},
  {id:'arabic',    e:'🌙', label:'Arabic',           q:'arabic full movie free complete watch english subtitles',                  c:'#D4AC0D'},
  {id:'persian',   e:'🕌', label:'Persian/Iranian',  q:'iranian persian full movie free complete watch english subtitles',         c:'#7D6608'},
  {id:'portuguese',e:'🇧🇷', label:'Brazilian',        q:'brazilian portuguese full movie free complete watch subtitles',            c:'#27AE60'},
  {id:'mexican',   e:'🇲🇽', label:'Mexican',          q:'mexican spanish full movie free complete watch 2024',                      c:'#E74C3C'},
  {id:'caribbean', e:'🌴', label:'Caribbean Film',   q:'caribbean full movie free complete jamaica trinidad film',                  c:'#00BCD4'},
  {id:'documentary',e:'📽️',label:'Documentary',      q:'documentary full film free complete watch 2024 award',                    c:'#4CAF50'},
  {id:'war',       e:'⚔️', label:'War Film',         q:'war full movie free complete watch military film english',                 c:'#5D6D7E'},
  {id:'western',   e:'🤠', label:'Western',          q:'western cowboy full movie free complete watch classic',                    c:'#8D6E63'},
  {id:'crime',     e:'🔍', label:'Crime',            q:'crime gangster full movie free complete watch english',                    c:'#2C3E50'},
  {id:'biography', e:'🏅', label:'Biography',        q:'biography true story full movie free complete watch',                     c:'#D35400'},
  {id:'history_m', e:'🏛️', label:'Historical Film',  q:'historical period full movie free complete watch epic',                   c:'#7B241C'},
  {id:'kids_m',    e:'👶', label:'Kids & Family',    q:'family kids full movie free complete watch animated 2024',                 c:'#FF9800'},
  {id:'superhero', e:'🦸', label:'Superhero',        q:'superhero action full movie free complete watch 2024',                    c:'#0984E3'},
  {id:'mystery',   e:'🔎', label:'Mystery',          q:'mystery detective full movie free complete watch english',                 c:'#6C3483'},
  {id:'musical',   e:'🎵', label:'Musical',          q:'musical full movie free complete watch songs dance film',                  c:'#E91E63'},
  {id:'blackfilm', e:'✊', label:'Black Cinema',     q:'black cinema full movie free complete african american film',              c:'#1C2833'},
  {id:'diasporan', e:'🌍', label:'Diaspora Stories', q:'african diaspora black british film full movie free complete',             c:'#A04000'},
  {id:'award',     e:'🏆', label:'Award Winners',    q:'oscar cannes award winning full movie free complete watch',               c:'#D4AC0D'},
];

let curCat = GENRES[0], pageToken = '', loading = false, loaded = 0, sTimer = null, curQ = '';

// ── BUILD UI ─────────────────────────────────────────────
function buildGenres() {
  document.getElementById('genres').innerHTML = GENRES.map(g =>
    `<div class="chip ${g.id===curCat.id?'on':'off'}"
      style="${g.id===curCat.id?`background:${g.c};border-color:${g.c}`:`border-color:${g.c}33;color:${g.c}`}"
      onclick="selectCat('${g.id}')">${g.e} ${g.label}</div>`
  ).join('');
}

function selectCat(id) {
  const cat = GENRES.find(g=>g.id===id);
  if(!cat || cat.id===curCat.id) return;
  curCat = cat; curQ = ''; pageToken = ''; loaded = 0;
  document.getElementById('search').value = '';
  document.getElementById('clr').style.display = 'none';
  buildGenres(); fetchMovies(true);
}

// ── SEARCH ────────────────────────────────────────────────
function onSearch() {
  const v = document.getElementById('search').value;
  document.getElementById('clr').style.display = v ? 'flex' : 'none';
  clearTimeout(sTimer);
  sTimer = setTimeout(() => { curQ = v.trim(); pageToken = ''; loaded = 0; fetchMovies(true); }, 500);
}
function clearSearch() {
  document.getElementById('search').value = '';
  document.getElementById('clr').style.display = 'none';
  curQ = ''; pageToken = ''; loaded = 0; fetchMovies(true);
}

// ── BUILD QUERY ───────────────────────────────────────────
function buildQuery() {
  if (curQ) {
    // User typed something - append "full movie" if not already there
    return curQ.toLowerCase().includes('full') ? curQ : curQ + ' full movie free';
  }
  return curCat.q;
}

// ── SKELETONS ─────────────────────────────────────────────
function showSkels(n=12) {
  document.getElementById('grid').innerHTML = Array(n).fill(0).map(()=>`
    <div class="skel">
      <div class="skel-thumb"></div>
      <div class="skel-body"><div class="skel-line"></div><div class="skel-line s"></div></div>
    </div>`).join('');
}

// ── FETCH ─────────────────────────────────────────────────
async function fetchMovies(reset = false) {
  if(loading) return;
  loading = true;
  const btn = document.getElementById('lmbtn');
  const lmw = document.getElementById('lmw');
  if(reset) { showSkels(); lmw.style.display = 'none'; }
  else { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div><span>Loading…</span>'; }

  const params = new URLSearchParams({
    part: 'snippet',
    type: 'video',
    videoDuration: 'long',       // ← KEY FILTER: 20+ minutes only
    safeSearch: 'moderate',
    maxResults: MAX,
    q: buildQuery(),
    key: API_KEY,
    relevanceLanguage: 'en',
    ...(pageToken && !reset ? { pageToken } : {})
  });

  try {
    const res = await fetch(`${API_BASE}?${params}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);

    const items = data.items || [];
    pageToken = data.nextPageToken || '';

    if(reset) { renderCards(items, false); loaded = items.length; }
    else { appendCards(items); loaded += items.length; }

    document.getElementById('count').textContent = `${loaded.toLocaleString()}+ movies`;

    if(pageToken) { lmw.style.display='flex'; btn.disabled=false; btn.innerHTML='<span>Load More Movies</span>'; }
    else lmw.style.display = 'none';

  } catch(e) {
    if(reset) document.getElementById('grid').innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-msg">Couldn't load movies.<br>Check connection and try again.<br><small style="color:#333">${e.message}</small></div>
      </div>`;
    lmw.style.display = 'none';
    console.error(e);
  }
  loading = false;
}

function loadMore() { fetchMovies(false); }

// ── RENDER ────────────────────────────────────────────────
function renderCards(items, append) {
  const grid = document.getElementById('grid');
  if(!append) grid.innerHTML = '';
  if(!items.length && !append) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><div class="empty-msg">No full movies found for this search.<br>Try another category or search term.</div></div>`;
    return;
  }
  items.forEach(item => grid.appendChild(buildCard(item)));
}
function appendCards(items) {
  const grid = document.getElementById('grid');
  items.forEach(item => grid.appendChild(buildCard(item)));
}

function buildCard(item) {
  const vid = item.id.videoId;
  const sn = item.snippet;
  const title = sn.title.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const ch = sn.channelTitle;
  const thumb = sn.thumbnails?.medium?.url || sn.thumbnails?.default?.url || '';
  const url = `https://www.youtube.com/watch?v=${vid}`;

  const a = document.createElement('a');
  a.className = 'card';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.innerHTML = `
    <div class="thumb-wrap">
      <div class="thumb-placeholder" style="background:linear-gradient(135deg,${curCat.c}18,${curCat.c}08)">${curCat.e}</div>
      <img class="thumb loading" src="${thumb}" alt="${title.replace(/"/g,'')}" loading="lazy"
           onload="this.classList.remove('loading')" onerror="this.style.display='none'">
      <div class="play-overlay"><div class="play-circle">▶</div></div>
      <div class="full-badge">FULL MOVIE</div>
      <div class="duration-badge">20min+</div>
    </div>
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <div class="card-ch">${ch}</div>
        <div class="card-genre" style="background:${curCat.c}22;color:${curCat.c}">${curCat.e}</div>
      </div>
    </div>`;
  return a;
}

// ── INIT ─────────────────────────────────────────────────
buildGenres();
fetchMovies(true);
</script>
</body>
</html>
